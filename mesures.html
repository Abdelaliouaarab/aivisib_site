<meta property="og:type" content="article"><meta property="og:site_name" content="AIVisib"><meta property="og:url" content="https://aivisib.com/mesures"><meta property="og:title" content="Mesures réelles de visibilité IA — AIVisib"><meta property="og:description" content="De vraies questions posées en direct à ChatGPT et Gemini, réponses comptées, rien de simulé. Compagnies aériennes, banques, hôtels, hôpitaux, écoles, en anglais, français et arabe."><meta property="og:image" content="https://aivisib.com/brand/linkedin/li_post2_airline.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* ===== THÈME CLAIR (défaut) ===== */
  --ink:#F7F4EC; --ink2:#EFEAE0; --panel:#FFFFFF; --line:rgba(20,20,26,.12);
  --cream:#14141A; --dim:#5F5F68; --acid:#CCFF2E; --acid-ink:#5C8A00; --hot:#E04A2E; --cool:#0FA47F;
  --nav-bg:rgba(247,244,236,.85); --input-bg:#FFFFFF; --track:#E6E1D4;
  --bar1:#B9B4A4; --bar2:#C6C1B1; --bar3:#D2CDBD;
  --shadow-demo:0 30px 70px rgba(20,20,26,.18);
  --shadow-dash:0 40px 90px rgba(20,20,26,.16),0 0 0 1px rgba(20,20,26,.04);
  --herocard-bg:linear-gradient(145deg,#EFF6D6,#FFFFFF);
  --pltop-bg:linear-gradient(160deg,#F1F8DA,#FFFFFF);
  --final-bg:linear-gradient(150deg,#EDF4D8,#F7F4EC);
}
/* ===== THÈME SOMBRE (choix visiteur) ===== */
body.dark{
  --ink:#0A0A0B; --ink2:#111114; --panel:#161619; --line:rgba(255,255,255,.09);
  --cream:#F5F1E8; --dim:#8E8E96; --acid-ink:#CCFF2E; --hot:#FF5C3E; --cool:#5BE7C4;
  --nav-bg:rgba(10,10,11,.82); --input-bg:#0C0C0F; --track:#232329;
  --bar1:#4A4A55; --bar2:#3A3A44; --bar3:#2E2E36;
  --shadow-demo:0 40px 90px rgba(0,0,0,.6);
  --shadow-dash:0 50px 120px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06);
  --herocard-bg:linear-gradient(145deg,#1B2410,#141419);
  --pltop-bg:linear-gradient(160deg,#1C2410,#141418);
  --final-bg:linear-gradient(150deg,#1A2210,#101014);
}
/* Zones qui restent SOMBRES dans les deux thèmes (l'IA qui répond = rendu "capture d'app") */
.demo,.au-card{
  --ink:#0A0A0B;--ink2:#111114;--panel:#161619;--line:rgba(255,255,255,.09);
  --cream:#F5F1E8;--dim:#9A9AA3;--acid-ink:#CCFF2E;--hot:#FF5C3E;--cool:#5BE7C4;--input-bg:#0C0C0F;
  color:#F5F1E8;
}
/* dans la maquette blanche du rapport, l'accent reste le vert acide sur puces sombres */
.erc{--acid-ink:var(--acid)}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;overflow-x:hidden;max-width:100%;width:100%;overscroll-behavior-x:none}
body{background:var(--ink);color:var(--cream);font-family:'Space Grotesk',system-ui,sans-serif;line-height:1.55;overflow-x:hidden;max-width:100%;width:100%;position:relative;overscroll-behavior-x:none;-webkit-font-smoothing:antialiased}
.ticker,.strip{max-width:100%}
.ticker div,.strip div{will-change:transform}
body.rtl{direction:rtl;font-family:'Cairo',sans-serif}
a{color:inherit;text-decoration:none}
.wrap{max-width:1240px;margin:0 auto;padding:0 26px}
.mono{font-family:'JetBrains Mono',monospace}
.serif{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400}
body.rtl .serif{font-family:'Cairo',sans-serif;font-style:normal;font-weight:900}

/* ticker */
.ticker{background:var(--acid);color:#0A0A0B;overflow:hidden;white-space:nowrap;padding:9px 0;font-weight:600;font-size:13px;letter-spacing:.02em}
.ticker div{display:inline-block;animation:slide 32s linear infinite}
.ticker span{padding:0 26px}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* nav */
header{position:sticky;top:0;z-index:100;background:var(--nav-bg);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
nav{display:flex;align-items:center;justify-content:space-between;height:72px;gap:14px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:-.02em;color:inherit;text-decoration:none}
.logo i{width:26px;height:26px;border-radius:7px;background:var(--acid);display:grid;place-items:center;font-style:normal;color:#0A0A0B;font-size:14px;font-weight:700}
.nl{display:flex;align-items:center;gap:26px}
.nl a{color:var(--dim);font-size:14.5px}
.nl a:hover{color:var(--cream)}
@media(max-width:880px){.nl .hm{display:none}}
/* menu mobile (burger) */
.burger{display:none;width:38px;height:38px;border:1px solid var(--line);border-radius:10px;background:none;cursor:pointer;flex-direction:column;align-items:center;justify-content:center;gap:5px;flex:none}
.burger span{display:block;width:18px;height:2px;background:var(--cream);border-radius:2px;transition:.2s}
.burger[aria-expanded="true"] span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.burger[aria-expanded="true"] span:nth-child(2){opacity:0}
.burger[aria-expanded="true"] span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.mmenu{display:none;flex-direction:column;border-top:1px solid var(--line);padding:6px 0 12px}
.mmenu a{padding:12px 6px;font-size:16px;font-weight:600;color:var(--cream);border-bottom:1px solid var(--line)}
.mmenu a:last-child{border-bottom:0}
@media(max-width:880px){.burger{display:flex}.mmenu.open{display:flex}}
.lang{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;flex:none}
.lang button{background:none;border:0;color:var(--dim);font-family:'JetBrains Mono',monospace;font-weight:600;font-size:12.5px;
 min-width:34px;height:32px;display:flex;align-items:center;justify-content:center;padding:0 8px;cursor:pointer;line-height:1}
.lang button#b_ar{font-family:'Cairo','Segoe UI',sans-serif;font-size:16px;font-weight:700}
.lang button.on{background:var(--cream);color:var(--ink)}
.tswitch{position:relative;width:34px;height:34px;border-radius:99px;border:1px solid var(--line);background:none;color:var(--dim);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden;transition:border-color .18s,color .18s}
.tswitch .tsk{position:absolute;inset:0;border-radius:99px;background:var(--acid);transform:scale(0);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.tswitch .ti{position:absolute;width:17px;height:17px;transition:transform .42s cubic-bezier(.2,.8,.2,1),opacity .25s}
.tswitch .ti-sun{transform:rotate(-90deg) scale(.4);opacity:0}
.tswitch .ti-moon{transform:rotate(0) scale(1);opacity:1}
body.dark .tswitch .ti-sun{transform:rotate(0) scale(1);opacity:1}
body.dark .tswitch .ti-moon{transform:rotate(90deg) scale(.4);opacity:0}
.tswitch:hover{border-color:transparent;color:var(--ink)}
.tswitch:hover .tsk{transform:scale(1)}
.tswitch:active .ti{transform:scale(.85)}
@media(max-width:560px){
  nav{gap:8px}.nl{gap:9px}
  .lang button{min-width:27px;padding:0 5px;font-size:11.5px}
  .lang button#b_ar{font-size:14px}
  .tswitch{width:29px;height:29px}.tswitch .ti{width:15px;height:15px}
  .cta{padding:10px 13px;font-size:13px}
}
.cta{background:var(--acid);color:#0A0A0B;font-weight:700;padding:11px 20px;border-radius:99px;font-size:14px;transition:.18s;display:inline-block}
.cta:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(204,255,46,.28)}
.cta.big{padding:17px 34px;font-size:16.5px}
.cta.out{background:transparent;color:var(--cream);border:1px solid var(--line)}
.cta.out:hover{box-shadow:none;border-color:var(--cream)}

/* hero */
.hero{padding:78px 0 90px;position:relative;overflow:hidden}
.final{overflow:hidden}
.hero::before{content:"";position:absolute;top:-160px;left:12%;width:620px;height:420px;border-radius:50%;
 background:radial-gradient(circle,rgba(204,255,46,.13),transparent 68%);filter:blur(50px);pointer-events:none}
.hgrid{display:grid;grid-template-columns:1.02fr .98fr;gap:56px;align-items:center;position:relative}
@media(max-width:1000px){.hgrid{grid-template-columns:1fr;gap:44px}}
.kicker{display:inline-flex;align-items:center;gap:9px;font:500 12px 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--acid-ink);margin-bottom:26px;padding-block:6px;padding-inline:10px 13px;border-radius:99px;background:rgba(200,255,0,.13);border:1px solid rgba(200,255,0,.35)}
body.dark .kicker{background:rgba(200,255,0,.09);border-color:rgba(200,255,0,.25)}
.kicker s{display:flex;align-items:flex-end;gap:2.5px;height:13px;text-decoration:none;direction:ltr}
.kicker s i{display:block;width:3px;border-radius:2px;background:var(--acid-ink);transform-origin:bottom;animation:kbar 1.8s ease-in-out infinite}
.kicker s i:nth-child(1){height:5px}.kicker s i:nth-child(2){height:9px;animation-delay:.25s}.kicker s i:nth-child(3){height:13px;animation-delay:.5s}
@keyframes kbar{0%,100%{transform:scaleY(1);opacity:.65}50%{transform:scaleY(.45);opacity:1}}
@media(prefers-reduced-motion:reduce){.kicker s i{animation:none}}
body.rtl .kicker{letter-spacing:0;font-family:'Cairo',sans-serif}
h1{font-size:clamp(40px,5.6vw,74px);line-height:.99;letter-spacing:-.035em;font-weight:700;margin-bottom:24px}
body.rtl h1{letter-spacing:0;line-height:1.25}
h1 em{color:var(--acid-ink)}
.sub{color:var(--dim);font-size:clamp(16px,1.7vw,19px);max-width:520px;margin-bottom:34px}
.btns{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
/* hero : test gratuit directement dans le premier écran */
.herof{display:flex;gap:10px;align-items:stretch;max-width:560px;margin-top:6px}
.herof input{flex:1;min-width:0;background:var(--input-bg);border:1px solid var(--line);color:var(--cream);padding:15px 18px;border-radius:99px;font-size:16px;font-family:inherit}
.herof input:focus{outline:none;border-color:var(--acid-ink)}
.herof .cta.big{padding:15px 26px;white-space:nowrap;border:0;cursor:pointer;font-family:inherit}
@media(max-width:560px){.herof{flex-direction:column}.herof .cta.big{width:100%}}
.hlink{color:var(--dim);font-size:14px;text-decoration:underline;text-underline-offset:3px}
.hlink:hover{color:var(--cream)}
/* ===== pages dédiées (?view=agences|compare|faq) et accueil allégé ===== */
body:not([data-view]) #agences,body:not([data-view]) #compare{display:none}
body:not([data-view]) #faq details:nth-of-type(n+7),body:not([data-view]) #faq .faqh:nth-of-type(n+3),body:not([data-view]) #faq .faqmore{display:none}
.faqall{display:inline-block;margin-top:22px;font-weight:600;text-decoration:underline;text-underline-offset:3px;color:var(--cream)}
body[data-view] .faqall{display:none}
body[data-view] .hero,body[data-view] section.s:not(.vshow),body[data-view] #join{display:none}
body[data-view] section.vshow{padding-top:40px}
.vback{max-width:1180px;margin:22px auto 0;padding:0 24px}
.vback a{font:600 13px 'JetBrains Mono',monospace;color:var(--dim);text-decoration:none}
.vback a:hover{color:var(--cream)}
body.rtl .vback a{font-family:'Cairo',sans-serif}
.pcmp{margin-top:18px;font-weight:600;text-decoration:underline;text-underline-offset:3px;color:var(--cream);display:inline-block}
/* confiance sous l'audit */
.au-trust{margin-top:18px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.au-trust span{font:600 12.5px 'JetBrains Mono',monospace;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--input-bg);color:var(--cream)}
.au-trust span::before{content:"✓ ";color:var(--acid-ink)}
body.rtl .au-trust span{font-family:'Cairo',sans-serif}
.au-founder{margin-top:14px;display:flex;align-items:center;gap:12px;justify-content:center;font-size:13.5px;color:var(--dim)}
.au-founder i{width:36px;height:36px;border-radius:50%;background:var(--acid);color:#0A0A0B;display:grid;place-items:center;font-style:normal;font-weight:800;flex:none}
.au-founder b{color:var(--cream)}
.au-founder img{width:36px;height:36px;border-radius:50%;object-fit:cover;flex:none;border:2px solid var(--acid)}
.au-founder.team{margin-top:8px}
.au-founder a{color:inherit;text-decoration:none}.au-founder a b{border-bottom:1px dotted var(--acid)}.au-founder a:hover b{color:var(--acid)}
.au-founder.team i{background:#0A0A0B;color:var(--acid);border:1.5px solid var(--acid)}
@media(max-width:560px){.au-founder{text-align:start;align-items:flex-start}.au-founder i,.au-founder img{margin-top:2px}}
/* boîte email après le résultat de l'audit */
.au-mailbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--ink2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.au-mailbox span{flex:1 1 100%;font-size:13.5px;color:var(--cream);font-weight:600}
.au-mailbox input{flex:1;min-width:180px;background:var(--input-bg);border:1px solid var(--line);color:var(--cream);padding:10px 12px;border-radius:9px;font-size:14px;font-family:inherit}
.au-mailbox button{border:0;cursor:pointer;font-family:inherit}
/* lisibilité mobile : rien sous 12,5 px */
@media(max-width:560px){.kicker,.note,.hwtrust,.pvk,.faqh,.mk-lab,.mk-chip,.cmpnote,.au-meta,.b .n,.hwchip,.flags span,.mk-ok,.pl h3,.pl .meas span,.erc-banner,.af-note{font-size:12.5px!important}}
.note{margin-top:22px;font:500 12.5px 'JetBrains Mono',monospace;color:var(--dim)}
body.rtl .note{font-family:'Cairo',sans-serif}

/* live chat demo */
.demo{background:var(--ink2);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow-demo)}
.demo .bar{display:flex;align-items:center;gap:8px;padding:13px 16px;border-bottom:1px solid var(--line);background:#0D0D10}
.demo .bar i{width:9px;height:9px;border-radius:50%;background:#2A2A30;display:block}
.demo .bar .eng{margin-inline-start:auto;font:500 11.5px 'JetBrains Mono',monospace;color:var(--dim);display:flex;align-items:center;gap:7px}
.demo .bar .eng b{width:6px;height:6px;border-radius:50%;background:var(--cool);display:block;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.demo .body{padding:22px;min-height:326px;display:flex;flex-direction:column;gap:16px}
.bubble{max-width:88%;padding:13px 16px;border-radius:15px;font-size:14.6px;line-height:1.6}
.bubble.you{align-self:flex-end;background:#22222A;border-bottom-right-radius:5px}
body.rtl .bubble.you{border-bottom-right-radius:15px;border-bottom-left-radius:5px}
.bubble.ai{align-self:flex-start;background:#0C1A16;border:1px solid rgba(91,231,196,.22);border-bottom-left-radius:5px;min-height:46px}
body.rtl .bubble.ai{border-bottom-left-radius:15px;border-bottom-right-radius:5px}
.bubble .cursor{display:inline-block;width:7px;height:15px;background:var(--cool);vertical-align:-2px;animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
mark.win{background:rgba(204,255,46,.19);color:var(--acid-ink);border-radius:4px;padding:1px 5px;font-weight:600}
mark.lose{background:rgba(255,92,62,.16);color:var(--hot);border-radius:4px;padding:1px 5px;font-weight:600}
.verdict{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:14px;border-top:1px dashed var(--line);
 font:500 12.5px 'JetBrains Mono',monospace;opacity:0;transition:opacity .5s}
body.rtl .verdict{font-family:'Cairo',sans-serif}
.verdict.show{opacity:1}
.verdict .pill{padding:5px 11px;border-radius:99px;font-weight:700}
.pill.ok{background:rgba(204,255,46,.14);color:var(--acid-ink)}
.pill.no{background:rgba(255,92,62,.14);color:var(--hot)}

/* logos strip */
.strip{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:22px 0;overflow:hidden;white-space:nowrap}
.strip div{display:inline-block;animation:slide 26s linear infinite}
.strip span{padding:0 34px;color:var(--dim);font:500 15px 'JetBrains Mono',monospace;letter-spacing:-.01em}

/* sections */
section.s{padding:96px 0}
.head{max-width:660px;margin-bottom:54px}
.head .kicker{margin-bottom:18px}
h2{font-size:clamp(30px,3.8vw,48px);line-height:1.06;letter-spacing:-.03em;font-weight:700;margin-bottom:16px}
body.rtl h2{letter-spacing:0;line-height:1.35}
.head p{color:var(--dim);font-size:17px}

/* bar race */
.race{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:32px}
.race .rw{margin-bottom:20px}
.race .rl{display:flex;justify-content:space-between;font-size:14.5px;margin-bottom:9px}
.race .rl b{font-family:'JetBrains Mono',monospace;font-weight:700}
body.rtl .race .rl b{font-family:'Cairo',sans-serif}
.track{height:11px;background:var(--track);border-radius:99px;overflow:hidden}
.fill{display:block;height:100%;width:0;border-radius:99px;transition:width 1.4s cubic-bezier(.22,1,.36,1)}
.fill.me{background:linear-gradient(90deg,var(--acid),#9BE000)}
.fill.c1{background:var(--bar1)}.fill.c2{background:var(--bar2)}.fill.c3{background:var(--bar3)}

/* bento */
.bento{display:grid;grid-template-columns:repeat(6,1fr);gap:18px}
@media(max-width:980px){.bento{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.bento{grid-template-columns:1fr}}
.b{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px;transition:.25s;position:relative;overflow:hidden}
.b:hover{border-color:rgba(204,255,46,.35);transform:translateY(-3px)}
.b.w3{grid-column:span 3}.b.w2{grid-column:span 2}.b.w4{grid-column:span 4}
@media(max-width:980px){.b.w3,.b.w2,.b.w4{grid-column:span 1}}
.b .n{font:500 11.5px 'JetBrains Mono',monospace;color:var(--dim);margin-bottom:16px;display:block}
body.rtl .b .n{font-family:'Cairo',sans-serif}
.b h3{font-size:20px;letter-spacing:-.02em;margin-bottom:9px;font-weight:600}
body.rtl .b h3{letter-spacing:0}
.b p{color:var(--dim);font-size:14.8px}
.b.hero-card{background:var(--herocard-bg);border-color:rgba(140,180,20,.45)}
.b.hero-card h3{color:var(--acid-ink)}
.flags{display:flex;gap:8px;margin-top:18px}
.flags span{font:600 12px 'JetBrains Mono',monospace;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--input-bg)}
body.rtl .flags span{font-family:'Cairo',sans-serif}

/* steps */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);border-radius:20px;overflow:hidden}
@media(max-width:880px){.steps{grid-template-columns:1fr}}
.stp{padding:34px 30px;border-inline-end:1px solid var(--line);background:var(--panel)}
.stp:last-child{border:0}
@media(max-width:880px){.stp{border-inline-end:0;border-bottom:1px solid var(--line)}}
.stp .num{font-family:'Instrument Serif',serif;font-style:italic;font-size:52px;line-height:1;color:var(--acid-ink);margin-bottom:16px;display:block}
body.rtl .stp .num{font-family:'Cairo',sans-serif;font-style:normal;font-weight:900;font-size:44px}
.stp h3{font-size:19px;margin-bottom:8px;font-weight:600}
.stp p{color:var(--dim);font-size:14.8px}

/* how it works v2 : 4 étapes texte + mini-capture */
.hw{display:grid;gap:14px}
.hwr{display:grid;grid-template-columns:1.05fr .95fr;gap:36px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:30px 34px;transition:.25s}
.hwr:hover{border-color:rgba(204,255,46,.35)}
.hwr:nth-child(even){grid-template-columns:.95fr 1.05fr}
.hwr:nth-child(even) .hwm{order:-1}
@media(max-width:880px){.hwr{grid-template-columns:1fr!important;gap:22px;padding:24px 22px}.hwr:nth-child(even) .hwm{order:0}}
.hwn{font-family:'Instrument Serif',serif;font-style:italic;font-size:46px;line-height:1;color:var(--acid-ink);display:block}
body.rtl .hwn{font-family:'Cairo',sans-serif;font-style:normal;font-weight:900;font-size:38px}
.hwt h3{font-size:22px;letter-spacing:-.02em;margin:12px 0 8px;font-weight:600}
body.rtl .hwt h3{letter-spacing:0}
.hwt p{color:var(--dim);font-size:15px}
.hwchip{display:inline-flex;align-items:center;gap:8px;margin-top:16px;font:600 12px 'JetBrains Mono',monospace;padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:var(--input-bg);color:var(--acid-ink)}
body.rtl .hwchip{font-family:'Cairo',sans-serif}
.hwm{background:var(--ink2);border:1px solid var(--line);border-radius:16px;padding:16px;font-size:13px;min-width:0}
.mk-lab{font:500 10.5px 'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
body.rtl .mk-lab{font-family:'Cairo',sans-serif;letter-spacing:0}
.mk-in{border:1px solid var(--line);background:var(--input-bg);border-radius:10px;padding:9px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.mk-in b{font-weight:600}
.mk-chips{display:flex;flex-wrap:wrap;gap:6px}
.mk-chip{font:600 11.5px 'JetBrains Mono',monospace;padding:5px 10px;border-radius:99px;border:1px solid var(--line);background:var(--input-bg);color:var(--cream)}
.mk-chip.on{border-color:var(--acid-ink);color:var(--acid-ink)}
body.rtl .mk-chip{font-family:'Cairo',sans-serif}
.mk-q{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.mk-q:last-child{border-bottom:0}
.mk-q span{unicode-bidi:plaintext}
.mk-ok{font:600 10.5px 'JetBrains Mono',monospace;color:#1E7F4F;background:rgba(30,127,79,.12);padding:3px 8px;border-radius:99px;white-space:nowrap}
body.dark .mk-ok{color:#7ED9A5}
.mk-eng{display:flex;align-items:center;gap:10px;padding:7px 0}
.mk-eng b{width:78px;font-weight:600;flex:none}
.mk-track{flex:1;height:7px;border-radius:99px;background:var(--track);overflow:hidden}
.mk-track i{display:block;height:100%;border-radius:99px;background:var(--acid-ink)}
.mk-eng small{font:600 11px 'JetBrains Mono',monospace;color:var(--dim);width:44px;text-align:end;flex:none}
.mk-kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.mk-kpi{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--input-bg)}
.mk-kpi .v{font-size:24px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.mk-kpi .v small{font-size:12px;font-weight:600;color:var(--dim);letter-spacing:0;margin-inline-start:4px}
.mk-kpi .l{font-size:11px;color:var(--dim);margin-top:3px}
body.rtl .mk-kpi .v{direction:ltr;unicode-bidi:isolate;text-align:right}
.mk-plan{display:flex;gap:8px;align-items:flex-start;padding:6px 0;color:var(--cream)}
.mk-plan i{flex:none;width:18px;height:18px;border-radius:6px;background:var(--acid-ink);color:#0A0A0B;font:700 11px 'JetBrains Mono',monospace;display:grid;place-items:center;font-style:normal;margin-top:1px}
.hwtrust{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 26px;margin-top:26px;font:500 13px 'JetBrains Mono',monospace;color:var(--dim)}
.hwtrust span::before{content:"✓";color:var(--acid-ink);margin-inline-end:7px;font-weight:700}
body.rtl .hwtrust{font-family:'Cairo',sans-serif}
/* features v2 : mini-preuve dans chaque carte */
.fx{margin-top:18px;padding-top:14px;border-top:1px dashed var(--line);font-size:13px}
.fx .mk-eng b{width:auto;min-width:96px}
.fx svg{width:100%;height:46px;display:block}
.fx .mk-track{height:6px}

/* pricing */
.augdpr{font-size:11.5px;color:var(--dim);margin-top:8px;line-height:1.5}
.augdpr a{color:var(--dim);text-decoration:underline}
.agcta{margin-top:26px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px 28px}
.agcta p{color:var(--dim);font-size:15px;max-width:640px}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:980px){.plans{grid-template-columns:1fr}}
.pl{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:30px 28px;display:flex;flex-direction:column;position:relative;overflow:hidden;transition:.2s}
.pl:hover{transform:translateY(-4px);box-shadow:0 22px 50px rgba(20,20,26,.10)}
.pl.top::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--acid)}
.pl.top{background:var(--pltop-bg);border-color:var(--acid-ink);position:relative}
.pl .badge{position:absolute;top:16px;inset-inline-end:16px;background:var(--acid);color:#0A0A0B;font:700 10.5px 'JetBrains Mono',monospace;padding:4px 10px;border-radius:99px;letter-spacing:.05em}
body.rtl .pl .badge{font-family:'Cairo',sans-serif;letter-spacing:0}
.pl h3{font-size:12.5px;color:var(--acid-ink);font-weight:600;margin-bottom:12px;letter-spacing:.12em;text-transform:uppercase;font-family:'JetBrains Mono',monospace}
body.rtl .pl h3{font-family:'Cairo',sans-serif;letter-spacing:0}
.pl .price{font-size:54px;font-weight:700;letter-spacing:-.04em;line-height:1;margin-bottom:26px;font-family:'Space Grotesk',system-ui,sans-serif}
body.rtl .pl .price{font-family:'Cairo',sans-serif}
.pl .price small{font-size:15px;color:var(--dim);font-weight:400;letter-spacing:0}
.pl ul{list-style:none;margin-bottom:28px;flex:1}
.pl li{padding:8px 0;font-size:14.6px;color:var(--dim);display:flex;gap:10px;align-items:flex-start}
.pl li::before{content:"✓";flex:none;width:20px;height:20px;border-radius:6px;background:var(--acid);color:#0A0A0B;display:grid;place-items:center;font-size:12px;font-weight:800;margin-top:1px}
/* tarifs v2 */
.pl .who{font-size:13.5px;color:var(--dim);margin:-14px 0 18px;min-height:40px}
.pl .meas{background:var(--ink2);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:18px}
.pl .meas .mk-lab{margin-bottom:6px}
.pl .meas b{display:block;font-size:13.5px;font-weight:600;color:var(--cream);line-height:1.4}
.pl .meas span{display:block;font:600 12px 'JetBrains Mono',monospace;color:var(--acid-ink);margin-top:6px}
body.rtl .pl .meas span{font-family:'Cairo',sans-serif}
.pl.top .meas{background:var(--input-bg)}
.pvs{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:22px}
@media(max-width:980px){.pvs{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.pvs{grid-template-columns:1fr}}
.pv{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px 20px 18px;position:relative;overflow:hidden;transition:.2s}
.pv::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--acid)}
.pv:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(20,20,26,.10)}
.pv b{display:block;font-size:17px;font-weight:700;letter-spacing:-.02em;margin-bottom:12px}
.pv p{font-size:13.5px;color:var(--dim);line-height:1.5;margin:0}
.pv .pv-us,.pv .pv-them{display:flex;gap:9px;align-items:flex-start;padding:8px 0}
.pv .pv-us{color:var(--cream);border-bottom:1px dashed var(--line)}
.pv .pv-us::before{content:"✓";flex:none;width:20px;height:20px;border-radius:6px;background:var(--acid);color:#0A0A0B;display:grid;place-items:center;font-size:12px;font-weight:800}
.pv .pv-them::before{content:"–";flex:none;width:20px;height:20px;border-radius:6px;background:var(--ink2);border:1px solid var(--line);color:var(--dim);display:grid;place-items:center;font-size:13px;font-weight:800}
.pv .pv-them i{font-style:normal;font:600 11px 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:2px}
body.rtl .pv .pv-them i{font-family:'Cairo',sans-serif;letter-spacing:0}
body.rtl .pv::before{inset:0 0 0 auto}
.pvk{margin-top:30px;font:500 11.5px 'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
body.rtl .pvk{font-family:'Cairo',sans-serif;letter-spacing:0}

/* faq */
.faq{max-width:820px}
details{border-bottom:1px solid var(--line);padding:6px 0}
summary{cursor:pointer;list-style:none;padding:20px 0;font-size:18px;font-weight:600;display:flex;justify-content:space-between;gap:16px;letter-spacing:-.01em}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--acid-ink);font-size:24px;font-weight:400;line-height:1}
details[open] summary::after{content:"−"}
details p{color:var(--dim);padding:0 0 22px;font-size:15.4px;max-width:92%}
/* faq v2 : thèmes + pied */
.faq{max-width:900px}
.faqh{margin:38px 0 2px;font:500 11.5px 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--acid-ink)}
.faqh:first-child{margin-top:0}
body.rtl .faqh{font-family:'Cairo',sans-serif;letter-spacing:0}
.faqmore{margin-top:34px;padding:20px 24px;border:1px solid var(--line);border-radius:16px;background:var(--panel);font-size:15px;color:var(--dim);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.faqmore a{color:var(--cream);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* final */
.final{background:var(--final-bg);border:1px solid rgba(140,180,20,.35);border-radius:26px;padding:64px 42px;text-align:center;position:relative;overflow:hidden}
.final::before{content:"";position:absolute;top:-90px;left:50%;transform:translateX(-50%);width:520px;height:300px;
 background:radial-gradient(circle,rgba(204,255,46,.17),transparent 70%);filter:blur(44px)}
.final h2{max-width:640px;margin:0 auto 14px;position:relative}
.final p{color:var(--dim);max-width:500px;margin:0 auto 32px;position:relative}
form{display:flex;gap:10px;max-width:470px;margin:0 auto;flex-wrap:wrap;justify-content:center;position:relative}
form input{flex:1;min-width:230px;background:var(--input-bg);border:1px solid var(--line);color:var(--cream);
 padding:16px 20px;border-radius:99px;font:400 15px 'Space Grotesk',sans-serif}
body.rtl form input{font-family:'Cairo',sans-serif}
form input:focus{outline:none;border-color:var(--acid-ink)}
form button{border:0;cursor:pointer;font-family:inherit}

footer{border-top:1px solid var(--line);padding:38px 0;margin-top:80px}
.ft{display:flex;justify-content:space-between;flex-wrap:wrap;gap:14px;color:var(--dim);font-size:13.5px}
.rv{transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1),filter .8s ease}
.rv:not(.in){opacity:0;transform:translateY(30px) scale(.975);filter:blur(7px)}
.bench.rv:not(.in),.mdiag.rv:not(.in),.cmpscroll.rv:not(.in),.cmp.rv:not(.in),.rshot.rv:not(.in){filter:none}
/* ===== DASHBOARD PREVIEW (light zone = "real product" look) ===== */
.dashwrap{background:linear-gradient(180deg,#F5F1E8,#E9E4D6);border-radius:24px;padding:14px;box-shadow:var(--shadow-dash)}
.dash{background:#FBFAF6;border-radius:16px;overflow:hidden;color:#14141a;font-family:'Space Grotesk',sans-serif}
.dash .top{display:flex;align-items:center;gap:9px;padding:14px 18px;border-bottom:1px solid #E7E3D8;background:#fff}
.dash .top i{width:9px;height:9px;border-radius:50%;background:#D8D2C4;display:block}
.dash .top .ttl{margin-inline-start:8px;font-weight:600;font-size:14px}
.dash .top .live{margin-inline-start:auto;font:600 11px 'JetBrains Mono',monospace;color:#16a34a;display:flex;align-items:center;gap:6px}
.dash .top .live b{width:6px;height:6px;border-radius:50%;background:#16a34a;display:block;animation:pulse 1.6s infinite}
.dgrid{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;padding:20px}
@media(max-width:820px){.dgrid{grid-template-columns:1fr}}
.dcard{background:#fff;border:1px solid #ECE8DD;border-radius:13px;padding:16px 18px}
.dcard .lab{font:600 11px 'JetBrains Mono',monospace;color:#8a8577;letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
body.rtl .dcard .lab{font-family:'Cairo',sans-serif;letter-spacing:0}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid #ECE8DD;border-radius:13px;padding:14px 16px}
.kpi .big{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1}
.kpi .big.up{color:#16a34a}.kpi .big.acid{color:#5a7d00}
.kpi .sub{font-size:11.5px;color:#8a8577;margin-top:5px}
.kpi .big .arw{font-size:14px}
/* line chart */
.chartbox{height:150px;position:relative;margin-top:6px}
.chartbox svg{width:100%;height:100%;overflow:visible}
.gline{fill:none;stroke:#7A5CFF;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.garea{fill:url(#ag)}
.gdot{fill:#7A5CFF}
.gx{font:500 9px 'JetBrains Mono',monospace;fill:#a8a293}
/* share of voice bars */
.sov .row{margin-bottom:13px}
.sov .row:last-child{margin-bottom:0}
.sov .rl{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px;font-weight:500}
.sov .rl b{font-family:'JetBrains Mono',monospace}
body.rtl .sov .rl b{font-family:'Cairo',sans-serif}
.sbar{height:9px;background:#EFEBE0;border-radius:99px;overflow:hidden}
.sbar span{display:block;height:100%;width:0;border-radius:99px;transition:width 1.3s cubic-bezier(.22,1,.36,1)}
.sbar span.me{background:linear-gradient(90deg,#7A5CFF,#9B7Bff)}
.sbar span.c{background:#CFC8B6}
/* engine chips */
.dsources{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.srow{display:flex;align-items:center;gap:9px;font-size:12.5px}
.srow .fav{width:20px;height:20px;border-radius:5px;background:#EFEBE0;display:grid;place-items:center;font-size:11px;flex:none}
.srow .pct{margin-inline-start:auto;font:600 11px 'JetBrains Mono',monospace;color:#8a8577}
.langtabs{display:flex;gap:6px;margin-bottom:14px}
.langtabs span{font:600 10.5px 'JetBrains Mono',monospace;padding:4px 10px;border-radius:99px;background:#EFEBE0;color:#8a8577}
.langtabs span.on{background:#14141a;color:#CCFF2E}
body.rtl .langtabs span{font-family:'Cairo',sans-serif}
/* ===== REPORT PREVIEW CARDS ===== */
.rcards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:820px){.rcards{grid-template-columns:1fr}}
.rcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;position:relative}
.rcard .ic{font-size:26px;display:block;margin-bottom:12px}
.rcard h3{font-size:17px;margin-bottom:8px}
.rcard p{color:var(--dim);font-size:14.5px;line-height:1.6}
.rcard .quote{color:var(--cream);font-style:italic;border-inline-start:3px solid var(--acid);padding-inline-start:12px}
body.rtl .rcard .quote{font-style:normal}
.rcard .pbadge{position:absolute;top:20px;inset-inline-end:20px;padding:3px 9px;border-radius:99px;background:var(--acid);color:#0A0A0B;font:700 10px 'JetBrains Mono',monospace;letter-spacing:.05em}
body.rtl .rcard .pbadge{font-family:'Cairo',sans-serif;letter-spacing:0}
/* ===== REAL REPORT SCREENSHOT ===== */
.ercwrap{max-width:680px;margin:0 auto;background:linear-gradient(180deg,#F5F1E8,#E9E4D6);border-radius:22px;padding:12px;box-shadow:var(--shadow-dash)}
.erc{background:#fff;color:#14141a;border-radius:15px;overflow:hidden;text-align:start}
.erc-banner{background:#14141a;color:var(--acid-ink);font:700 10px 'JetBrains Mono',monospace;letter-spacing:.12em;text-align:center;padding:8px}
body.rtl .erc-banner{font-family:'Cairo',sans-serif;letter-spacing:0}
.erc-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid #ECE8DD;background:#FBFAF6;gap:10px}
.erc-brand{display:flex;align-items:center;gap:10px}
.erc-lg{width:34px;height:34px;border-radius:8px;background:#14141a;color:var(--acid-ink);display:grid;place-items:center;font-weight:700;flex:none}
.erc-brand b{font-size:16px;display:block}.erc-brand span{font-size:12px;color:#8a8577}
.erc-logo{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px;color:#14141a}
.erc-logo i{width:20px;height:20px;border-radius:5px;background:var(--acid);display:grid;place-items:center;color:#0A0A0B;font-size:11px;font-style:normal}
.erc-body{padding:18px}
.erc-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.erc-kpi{background:#fff;border:1px solid #ECE8DD;border-radius:11px;padding:12px 8px;text-align:center}
.erc-kpi .v{font-size:24px;font-weight:700;letter-spacing:-.03em;line-height:1}
.erc-kpi .v.up{color:#16a34a}.erc-kpi .v.vi{color:#7A5CFF}
.erc-kpi .l{font-size:10.5px;color:#8a8577;margin-top:5px;line-height:1.3}
.erc-sec{font:700 11px 'JetBrains Mono',monospace;color:#8a8577;text-transform:uppercase;letter-spacing:.04em;margin:20px 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
body.rtl .erc-sec{font-family:'Cairo',sans-serif;letter-spacing:0}
.erc-row{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600;color:#14141a;margin-bottom:6px}
.erc-row b,.erc-lang b{font-family:'JetBrains Mono',monospace}
body.rtl .erc-row b,body.rtl .erc-lang b{font-family:'Cairo',sans-serif}
.erc-track{height:9px;background:#EFEBE0;border-radius:99px;overflow:hidden;margin-bottom:11px}
.erc-track i{display:block;height:100%;border-radius:99px}
.erc-track i.me{background:linear-gradient(90deg,#7A5CFF,#9B7Bff)}.erc-track i.c{background:#CFC8B6}
.erc-lang{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.erc-lang .fav{width:22px;height:22px;border-radius:6px;background:#EFEBE0;display:grid;place-items:center;font:700 9px 'JetBrains Mono',monospace;color:#5a7d00;flex:none}
.erc-lang .erc-track{flex:1;margin-bottom:0}
.erc-lang b{font-size:12px;color:#8a8577;width:38px;text-align:end}
.erc-interp{background:#F7F5EF;border:1px solid #ECE8DD;border-radius:12px;padding:14px 16px;font-size:13.5px;color:#3c4043;line-height:1.7}
.erc-recos{list-style:none;margin:0;padding:0;counter-reset:erc}
.erc-recos li{counter-increment:erc;position:relative;padding:10px 14px 10px 42px;background:#fff;border:1px solid #ECE8DD;border-radius:11px;margin-bottom:8px;font-size:13.5px;color:#3c4043}
.erc-recos li::before{content:counter(erc);position:absolute;left:11px;top:10px;width:20px;height:20px;border-radius:6px;background:#14141a;color:var(--acid-ink);display:grid;place-items:center;font:700 11px 'JetBrains Mono',monospace}
body.rtl .erc-recos li{padding:10px 42px 10px 14px}body.rtl .erc-recos li::before{left:auto;right:11px}
.erc-prem{background:#14141a;color:var(--acid-ink);font:700 9px 'JetBrains Mono',monospace;padding:2px 8px;border-radius:99px;letter-spacing:.05em}
.erc-pitem{background:#fff;border:1px solid #ECE8DD;border-inline-start:4px solid #d93025;border-radius:11px;padding:13px 15px}
.erc-pitem b{font-size:14px;color:#14141a;display:block;margin-bottom:5px}
.erc-pitem p{font-size:12.5px;color:#6b6f76;line-height:1.55}
.erc-foot{padding:14px 18px;border-top:1px solid #ECE8DD;background:#FBFAF6;font-size:11.5px;color:#8a8577;text-align:end}
.erc-ok{color:#16a34a;font-weight:600}
@media(max-width:560px){.erc-kpi .v{font-size:20px}.erc-body{padding:15px}}
/* ===== FREE AUDIT ===== */
.auditbox{max-width:720px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px}
.af-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:560px){.af-row{grid-template-columns:1fr}}
.auditbox input{width:100%;background:var(--input-bg);border:1px solid var(--line);color:var(--cream);padding:14px 16px;border-radius:11px;font-size:15px;font-family:inherit}
.auditbox input:focus{outline:none;border-color:var(--acid-ink)}
.auditbox .cta.big{width:100%;justify-content:center;text-align:center;margin-top:4px}
.auditbox .cta.big:disabled{opacity:.55}
.af-note{text-align:center;color:var(--dim);font-size:12.5px;margin-top:12px}
.auditresult{margin-top:20px;border-top:1px solid var(--line);padding-top:20px}
.au-loading{text-align:center;color:var(--dim);font-size:15px;padding:14px}
.au-spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--acid-ink);border-radius:50%;animation:auspin 1s linear infinite;vertical-align:middle;margin-inline-end:9px}
@keyframes auspin{to{transform:rotate(360deg)}}
.au-err{text-align:center;color:var(--hot);font-size:14px;padding:6px}
.au-card{background:#0C0C0F;border:1px solid var(--line);border-radius:16px;padding:20px;text-align:start}
.au-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.au-brandline b{font-size:19px}.au-brandline span{color:var(--dim);font-size:14px}
.au-pill{padding:6px 13px;border-radius:99px;font:700 11px 'JetBrains Mono',monospace;letter-spacing:.05em;white-space:nowrap}
body.rtl .au-pill{font-family:'Cairo',sans-serif;letter-spacing:0}
.au-pill.ok{background:rgba(46,230,168,.15);color:#2ee6a8}.au-pill.no{background:rgba(255,92,62,.15);color:#ff7a4d}
.au-q{font-size:13px;color:var(--dim);margin-bottom:13px;line-height:1.5}.au-q i{color:var(--cream)}
.au-bubble{background:var(--ink2);border:1px solid var(--line);border-radius:14px;padding:15px 17px;font-size:14.5px;line-height:1.7;color:var(--cream);font-style:italic;margin-bottom:14px}
.au-ai{font:700 11px 'JetBrains Mono',monospace;color:var(--acid-ink);font-style:normal}
body.rtl .au-ai{font-family:'Cairo',sans-serif}
.au-named{font-size:14px;color:var(--cream);margin-bottom:14px}.au-named span{color:var(--dim)}
.au-verdict{font-size:17px;font-weight:700;margin-bottom:16px;line-height:1.4}
.au-verdict.ok{color:#2ee6a8}.au-verdict.no{color:#ff7a4d}
.au-cta{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:rgba(204,255,46,.06);border:1px solid rgba(204,255,46,.25);border-radius:12px;padding:14px 16px}
.au-cta span{font-size:14px;font-weight:600}
/* mini-audit v2 */
.au-meta{font:600 11px 'JetBrains Mono',monospace;color:var(--dim);letter-spacing:.06em}
body.rtl .au-meta{font-family:'Cairo',sans-serif;letter-spacing:0}
.au-score{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px;padding:14px 16px;background:var(--ink2);border:1px solid var(--line);border-radius:14px}
.au-big{font:700 44px 'JetBrains Mono',monospace;letter-spacing:-.04em;line-height:1;color:var(--cream)}
body.rtl .au-big{font-family:'Cairo',sans-serif;letter-spacing:0}
.au-sl{font-size:14.5px;font-weight:600;color:var(--cream);flex:1;line-height:1.35}
.au-sl small{display:block;color:var(--dim);font-size:12.5px;font-weight:500;margin-top:2px}
.au-grid{width:100%;border-collapse:collapse;margin-bottom:6px;font-size:13.5px;color:var(--cream)}
.au-grid th{font:600 11px 'JetBrains Mono',monospace;letter-spacing:.06em;color:var(--dim);text-align:start;padding:6px 8px;border-bottom:1px solid var(--line)}
body.rtl .au-grid th{font-family:'Cairo',sans-serif;letter-spacing:0}
.au-grid td{padding:9px 8px;border-bottom:1px solid var(--line)}
.au-grid td.au-c{text-align:center;font-weight:800;width:88px;font-size:15px}
.au-grid th:not(:first-child){text-align:center}
.au-c.y{color:#2ee6a8}.au-c.n{color:#ff7a4d}.au-c.na{color:var(--dim)}
.au-sec{font:600 11px 'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--acid-ink);margin:14px 0 8px}
body.rtl .au-sec{font-family:'Cairo',sans-serif;letter-spacing:0}
.au-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.au-chip{border:1px solid var(--line);background:var(--ink2);border-radius:99px;padding:5px 11px;font-size:13px;color:var(--cream)}
.au-chip b{color:var(--acid-ink);font-weight:700;margin-inline-start:3px}
.au-none{font-size:13.5px;color:var(--dim)}
.au-recos{margin:0 0 14px;padding-inline-start:20px;font-size:14px;line-height:1.55;color:var(--cream)}
.au-recos li{margin-bottom:7px}
.au-mail{font-size:13px;color:var(--dim);margin-bottom:12px}
.au-prog{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:12px auto 0;max-width:360px}
.au-prog i{display:block;height:100%;width:0;background:var(--acid-ink);animation:auprog 22s cubic-bezier(.2,.6,.3,1) forwards}
@keyframes auprog{to{width:94%}}
/* ===== COMPARISON TABLE ===== */
.cmp{max-width:760px;margin:0 auto;overflow-x:auto}
.cmptable{width:100%;border-collapse:separate;border-spacing:0;background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.cmptable th,.cmptable td{padding:16px 18px;text-align:start;font-size:14.8px;border-bottom:1px solid var(--line)}
.cmptable thead th{font-weight:700;font-size:15px}
.cmptable th.us{color:#0A0A0B;background:var(--acid);text-align:center;width:120px}
.cmptable th.them{color:var(--dim);text-align:center;width:120px}
.cmptable td.us{text-align:center;font-weight:700;color:var(--cream)}
.cmptable td.them{text-align:center;color:var(--dim)}
.cmptable tbody tr:last-child td{border-bottom:0}
.cmptable td b.y{color:#2ee6a8;font-size:18px}
.cmptable td b.n{color:#ff5c3e;font-size:18px}
.cmptable td:first-child{font-weight:500}
/* comparatif v2 : 4 colonnes nommées */
.cmp{max-width:none}
.cmptable{min-width:860px}
.cmptable th.us,.cmptable th.them{width:auto;min-width:150px}
.cmptable th.them{color:var(--cream);font-weight:600}
.cmptable td{font-size:14px;line-height:1.4}
.cmptable td.us{color:var(--cream);background:var(--herocard-bg)}
.cmptable td.them{font-weight:500}
.cmptable td:first-child{min-width:190px}
.cmptable th:first-child,.cmptable td:first-child{position:sticky;inset-inline-start:0;background:var(--panel);z-index:1;box-shadow:1px 0 0 var(--line)}
body.rtl .cmptable th:first-child,body.rtl .cmptable td:first-child{box-shadow:-1px 0 0 var(--line)}
.cmpnote{margin-top:14px;font-size:12.5px;color:var(--dim);line-height:1.5}
.cmpscroll{display:none;font:600 11.5px 'JetBrains Mono',monospace;color:var(--dim);margin-bottom:8px;letter-spacing:.08em}
@media(min-width:641px) and (max-width:900px){.cmpscroll{display:block}}
/* mobile : le tableau devient une carte par ligne (plus de défilement ni de texte coupé) */
@media(max-width:640px){
  .cmp{overflow:visible}
  .cmptable{min-width:0;display:block;border:0;background:transparent}
  .cmptable thead{display:none}
  .cmptable tbody,.cmptable tr,.cmptable td{display:block;width:100%;box-sizing:border-box}
  .cmptable tr{background:var(--panel);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}
  .cmptable td{border:0;padding:8px 14px;text-align:start;min-width:0;position:static;box-shadow:none}
  .cmptable td:first-child{font-weight:700;font-size:15px;padding:12px 14px 4px;background:var(--panel)}
  .cmptable td.us{background:var(--herocard-bg);border-top:1px solid var(--line);font-weight:700}
  .cmptable td.them{color:var(--dim);border-top:1px solid var(--line)}
  .cmptable td:not(:first-child)::before{content:attr(data-col);display:block;font:600 10.5px 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:2px}
  body.rtl .cmptable td:not(:first-child)::before{font-family:'Cairo',sans-serif;letter-spacing:0}
  .cmptable tbody tr:last-child td{border-bottom:0}
}
body.rtl .cmpscroll{font-family:'Cairo',sans-serif;letter-spacing:0}

/* ===== v3 ===== */
.hgrid{align-items:start}
.hgrid .auditbox{max-width:none;margin:0}
.au-head h2{font-size:22px;letter-spacing:-.02em;margin:4px 0 8px}
.au-head p{color:var(--dim);font-size:14px;margin-bottom:16px}
.au-head .kicker{margin-bottom:10px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:-12px 0 24px}
.pills span{font:600 12.5px 'JetBrains Mono',monospace;padding:6px 12px;border-radius:99px;background:var(--ink2);border:1px solid var(--line);color:var(--cream)}
body.rtl .pills span{font-family:'Cairo',sans-serif}
.tstrip{margin-top:26px;display:flex;flex-wrap:wrap;gap:8px 18px;font:500 13px 'JetBrains Mono',monospace;color:var(--dim)}
.tstrip span::before{content:"✓ ";color:var(--acid-ink);font-weight:700}
body.rtl .tstrip{font-family:'Cairo',sans-serif}
.shot{border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow-dash);max-height:960px;position:relative;background:var(--panel)}
.shot img{width:100%;height:auto;display:block}
.shot::after{content:"";position:absolute;left:0;right:0;bottom:0;height:140px;background:linear-gradient(transparent,var(--ink));pointer-events:none}
.mcards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media(max-width:820px){.mcards{grid-template-columns:1fr}}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px 24px}
.mq{font-family:'Instrument Serif',serif;font-style:italic;font-size:21px;line-height:1.3;margin-bottom:10px;color:var(--cream)}
body.rtl .mq{font-family:'Cairo',sans-serif;font-style:normal;font-weight:700;font-size:18px}
.mv{font-weight:700;font-size:16px;color:var(--acid-ink);margin-bottom:8px}
.mi{color:var(--dim);font-size:14.5px;line-height:1.55}
.mm{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:14px;font:500 12px 'JetBrains Mono',monospace;color:var(--dim)}
body.rtl .mm{font-family:'Cairo',sans-serif}
.ftg{display:grid;grid-template-columns:1.2fr 2fr;gap:28px;padding:34px 0 22px;border-bottom:1px solid var(--line);margin-bottom:16px}
@media(max-width:820px){.ftg{grid-template-columns:1fr}}
.ftc p{color:var(--dim);font-size:13.5px;margin-top:12px;max-width:380px}
.ftl{display:flex;flex-wrap:wrap;gap:10px 22px;align-content:start;justify-content:flex-end;font-size:14px}
@media(max-width:820px){.ftl{justify-content:flex-start}}
.ftl a{color:var(--dim)}.ftl a:hover{color:var(--cream)}

/* ===== v4 : visuel d'abord ===== */
.hero.v4{padding:64px 0 36px}
.hcenter{max-width:840px;margin:0 auto;text-align:center}
.hcenter .kicker{justify-content:center}
.hcenter h1{font-size:clamp(38px,5.2vw,68px)}
.hcenter .sub{margin:0 auto 28px;max-width:660px}
.hcenter .btns{justify-content:center}
.hcenter .tstrip{justify-content:center;margin-top:22px}
.hero-shot{margin-top:48px;max-height:640px}
.shotcap{text-align:center;color:var(--dim);font-size:13px;margin-top:14px}
.nums{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:28px 0;background:var(--ink2)}
.numgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;text-align:center}
.numgrid b{display:block;font-size:34px;letter-spacing:-.03em;font-weight:700;line-height:1.1;margin-bottom:4px}
.numgrid span{color:var(--dim);font-size:13.5px}
@media(max-width:700px){.numgrid{grid-template-columns:repeat(2,1fr)}}
.wg{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:820px){.wg{grid-template-columns:1fr}}
.wgc{background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.wgc img{width:100%;display:block;border-bottom:1px solid var(--line);background:#fff}
.wgc h3{font-size:19px;margin:18px 22px 6px;letter-spacing:-.02em}
.wgc p{color:var(--dim);font-size:14.5px;margin:0 22px 20px}
.steps4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:900px){.steps4{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.steps4{grid-template-columns:1fr}}
.st{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px}
.st h3{font-size:17px;margin:10px 0 12px;letter-spacing:-.01em;line-height:1.3}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.gal.gal2{grid-template-columns:repeat(3,1fr)}
@media(max-width:820px){.gal.gal2{grid-template-columns:1fr 1fr}}
@media(max-width:820px){.gal{grid-template-columns:repeat(2,1fr)}}
.gal a{display:block;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#0A0A0B}
.gal img{width:100%;display:block;transition:.25s}
.gal a:hover img{transform:scale(1.02)}
.auditbox.wide{max-width:960px;margin:0 auto}
.af-row4{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:12px}
.af-row4 input:nth-child(-n+3){grid-column:span 2}.af-row4 input:nth-child(n+4){grid-column:span 3}
@media(max-width:1000px){.af-row4{grid-template-columns:1fr 1fr}.af-row4 input{grid-column:auto!important}}
@media(max-width:820px){.af-row4{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.af-row4{grid-template-columns:1fr}}

/* ===== diagramme de méthode ===== */
.mdiag{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:26px}
.mflow{display:flex;align-items:stretch;gap:6px;overflow-x:auto;padding-bottom:6px}
.mnode{flex:1 1 0;min-width:150px;background:var(--ink2);border:1px solid var(--line);border-radius:16px;padding:14px 12px;text-align:start;cursor:pointer;color:var(--cream);font-family:inherit;transition:.18s;display:flex;flex-direction:column;gap:4px}
.mnode i{width:26px;height:26px;border-radius:8px;background:var(--line);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:13px;margin-bottom:6px}
.mnode b{font-size:15px;letter-spacing:-.01em}.mnode small{font:500 11.5px 'JetBrains Mono',monospace;color:var(--dim)}
body.rtl .mnode small{font-family:'Cairo',sans-serif}
.mnode:hover{border-color:var(--cream)}
.mnode.on{background:var(--acid);color:#0A0A0B;border-color:var(--acid)}.mnode.on i{background:#0A0A0B;color:var(--acid)}.mnode.on small{color:#0A0A0B;opacity:.7}
.marr{align-self:center;color:var(--dim);font-size:18px;flex:none}
body.rtl .marr{transform:scaleX(-1)}
.mpanel{margin-top:18px;border-top:1px solid var(--line);padding-top:20px;min-height:180px}
.mp h3{font-size:22px;letter-spacing:-.02em;margin-bottom:8px}.mp p{color:var(--dim);font-size:15px;max-width:760px}
.mrig{margin-top:16px;display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--cream)}
.mrig span:first-child{flex:none;font:600 11.5px 'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:#0A0A0B;background:var(--acid);padding:4px 8px;border-radius:6px}
body.rtl .mrig span:first-child{font-family:'Cairo',sans-serif;letter-spacing:0}
.meng{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.meng span{font-size:13px;padding:7px 12px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}.meng b{color:var(--cream)}
.mguard{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}@media(max-width:700px){.mguard{grid-template-columns:1fr}}
.mguard div{display:flex;gap:10px;align-items:flex-start;background:var(--ink2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px}
.mguard i{flex:none;width:22px;height:22px;border-radius:6px;background:var(--acid);color:#0A0A0B;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:12px}
.mcalc{margin-top:14px;background:var(--ink2);border:1px solid var(--line);border-radius:14px;padding:16px 18px;max-width:760px}
.mcrow{display:grid;grid-template-columns:240px 1fr;gap:14px;align-items:center;margin-bottom:10px}@media(max-width:600px){.mcrow{grid-template-columns:1fr}}
.mcrow label{font-size:14px;color:var(--dim)}.mcrow label b{color:var(--cream);font-family:'JetBrains Mono',monospace}
.mcrow input[type=range]{width:100%;accent-color:var(--acid-ink)}
.mcout{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 8px}.mcout div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.mcout small{display:block;color:var(--dim);font-size:11.5px;font-family:'JetBrains Mono',monospace;margin-bottom:3px}.mcout b{font-size:22px;letter-spacing:-.02em}
body.rtl .mcout small{font-family:'Cairo',sans-serif}
.mcnote{font-size:13px!important;color:var(--dim)}

/* ===== diagramme SVG ===== */
.mflow{overflow-x:auto;padding:4px 0 8px}
.mflow svg{width:100%;min-width:760px;display:block;direction:ltr}
.ml{fill:none;stroke:var(--line);stroke-width:1.4}
.ml.thick{stroke-width:2.2}
.md{fill:var(--acid-ink)}
.mnode rect{fill:var(--ink2);stroke:var(--line);stroke-width:1.2;transition:.18s;cursor:pointer}
.mnode:hover rect{stroke:var(--cream)}
.mnode.on rect{fill:var(--acid);stroke:var(--acid)}
.mnode.on .mgroup{fill:rgba(204,255,46,.18)}
.mnode text{cursor:pointer;pointer-events:none}
.mt1{font:700 17px 'Space Grotesk',system-ui,sans-serif;fill:var(--cream);letter-spacing:-.01em}
.mt1s{font:600 15px 'Space Grotesk',system-ui,sans-serif;fill:var(--cream)}
.mt2{font:500 11.5px 'JetBrains Mono',monospace;fill:var(--dim)}
.mnode.on .mt1,.mnode.on .mt2{fill:#0A0A0B}
.mgroup{fill:var(--panel);stroke:var(--line);stroke-dasharray:4 4}
.meng2 rect{fill:var(--ink2);stroke:var(--line)}
.mnode.on .meng2 rect{fill:var(--acid);stroke:var(--acid)}
.mnode.on .mt1s{fill:#0A0A0B}
.mtag,.mx3{font:700 12px 'JetBrains Mono',monospace;fill:var(--acid-ink)}
body.rtl .mt1,body.rtl .mt2,body.rtl .mgl{font-family:'Cairo',sans-serif}

/* ===== widget benchmark ===== */
.bench{margin-top:44px;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:var(--shadow-dash);text-align:start}
.bh{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;flex-wrap:wrap}
.bh h2{font-size:clamp(22px,2.4vw,30px);letter-spacing:-.02em;margin:6px 0 6px}
.bh p{color:var(--dim);font-size:14.5px;max-width:640px}
.bmeta{font:500 12px 'JetBrains Mono',monospace;color:var(--dim);white-space:nowrap;padding-top:6px}
body.rtl .bmeta{font-family:'Cairo',sans-serif}
.blogos{display:flex;gap:10px;overflow-x:auto;padding:18px 0 6px;scrollbar-width:thin}
.bl{flex:none;display:flex;align-items:center;gap:10px;background:var(--ink2);border:1px solid var(--line);border-radius:99px;padding:8px 16px 8px 10px;cursor:pointer;font-family:inherit;color:var(--cream);font-weight:600;font-size:14px;transition:.18s}
.bl img{width:30px;height:30px;object-fit:contain;background:#fff;border-radius:50%;padding:3px}
.bl[data-b=skoda] img,.bl[data-b=lexus] img,.bl[data-b=landrover] img{width:auto;min-width:56px;max-width:72px;border-radius:9px;padding:4px 6px}
.bl:hover{border-color:var(--cream)}
.bl.on{background:var(--acid);border-color:var(--acid);color:#0A0A0B}
.bfilters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0 18px}
@media(max-width:900px){.bfilters{grid-template-columns:repeat(2,1fr)}}
.bfilters label{display:flex;flex-direction:column;gap:5px;font:500 11.5px 'JetBrains Mono',monospace;color:var(--dim);letter-spacing:.04em;text-transform:uppercase}
body.rtl .bfilters label{font-family:'Cairo',sans-serif;letter-spacing:0}
.bfilters select{background:var(--input-bg);border:1px solid var(--line);color:var(--cream);border-radius:10px;padding:10px 12px;width:100%;min-width:0;font-family:'Space Grotesk',system-ui,sans-serif;font-size:14px;text-transform:none;letter-spacing:0}
.bfilters label{min-width:0}
.bfilters label[hidden]{display:none}
.bfilters label span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.rtl .bfilters select{font-family:'Cairo',sans-serif}
.bgrid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
@media(max-width:820px){.bgrid{grid-template-columns:1fr}}
.bbars{display:flex;flex-direction:column;gap:9px}
.bb{display:grid;grid-template-columns:150px 1fr 96px;gap:12px;align-items:center;font-size:14px}
